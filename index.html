<script>
  /* Tryb zrzutów: ?shot=1 wyłącza animacje i panel Stany jeszcze przed pierwszym renderem */
  (function () {
    var q = location.search || '';
    if (/[?&]shot=1(&|$)/.test(q)) document.documentElement.classList.add('is-shot');
    else document.documentElement.classList.add('is-booting');
    /* Wariant typografii: ?typo=a|b|c (zapamiętany w sessionStorage), domyślnie z data-typo na <html> */
    var m = q.match(/[?&]typo=([abc])(&|$)/), t = null;
    try { if (m) sessionStorage.setItem('pm-typo', m[1]); t = sessionStorage.getItem('pm-typo'); } catch (e) { t = m && m[1]; }
    if (t) document.documentElement.setAttribute('data-typo', t);
  })();
</script>
